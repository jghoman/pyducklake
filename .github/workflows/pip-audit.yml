# .github/workflows/pip-audit.yml
#
# NOTE: Per supply chain security best practices, replace all @vX.Y.Z tags
# with full 40-character commit SHAs. Find them at:
#   actions/checkout:        https://github.com/actions/checkout/releases
#   pypa/gh-action-pip-audit: https://github.com/pypa/gh-action-pip-audit/releases

name: pip-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly so new CVEs against existing deps are caught
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .
